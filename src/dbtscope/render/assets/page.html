<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{STYLE}}
</style></head><body>
<nav id="tabs">
  <span class="brand">{{TITLE}}</span>
  <button data-tab="universe"></button>
  <button data-tab="detail"></button>
  <span class="grow"></span>
  <span class="layout-actions">
    <button id="l-reset"></button>
    <button id="l-export"></button>
    <button id="l-import"></button>
    <input type="file" id="l-file" accept=".json,application/json" hidden>
  </span>
</nav>

<section class="tab" id="tab-universe">
  <aside class="panel" id="u-panel">
    <h3 id="u-h-links"></h3>
    <select id="u-links"></select>
    <h3 id="u-h-detail"></h3>
    <select id="u-detail"></select>
    <h3><span id="u-h-layers"></span></h3>
    <div id="u-layers"></div>
    <h3><span id="u-h-kinds"></span></h3>
    <div id="u-kinds"></div>
    <h3><span id="u-h-domains"></span><span><a id="u-all"></a> · <a id="u-none"></a></span></h3>
    <div id="u-domains"></div>
    <div class="hint" id="u-hint"></div>
  </aside>
  <div class="stage">
    <div class="toolbar">
      <button id="u-toggle">☰</button>
      <span class="meta" id="u-meta"></span>
      <span class="grow"></span>
      <input id="u-q" list="u-names" autocomplete="off"><datalist id="u-names"></datalist>
      <button id="u-fit"></button>
    </div>
    <div class="canvas-box" id="u-stage">
      <canvas id="u-canvas"></canvas>
      <div id="u-tip"></div>
    </div>
  </div>
</section>

<section class="tab" id="tab-detail">
  <aside class="panel" id="d-panel">
    <h3 id="d-h-group"></h3>
    <select id="d-group"></select>
    <h3 id="d-h-depth"></h3>
    <select id="d-depth"></select>
    <h3 id="d-h-cols"></h3>
    <button id="d-cols"></button>
    <h3 id="d-h-kinds"></h3>
    <div id="d-types"></div>
    <div class="hint" id="d-hint"></div>
  </aside>
  <div class="stage">
    <div class="toolbar">
      <button id="d-toggle">☰</button>
      <span class="meta" id="d-meta"></span>
      <span class="focus-info" id="d-focus-info"></span>
      <span class="grow"></span>
      <input id="d-focus" list="d-tables" autocomplete="off"><datalist id="d-tables"></datalist>
      <button id="d-clear"></button>
      <input id="d-q">
      <button id="d-fit"></button>
    </div>
    <div class="canvas-box"><div id="d-graph"></div></div>
  </div>
</section>

<script type="application/json" id="data">{{DATA}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/viz.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"></script>
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script>
{{DETAIL_JS}}
</script>
<script>
{{UNIVERSE_JS}}
</script>
<script>
{{BOOT_JS}}
</script>
</body></html>
