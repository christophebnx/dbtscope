<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{STYLE}}
</style></head><body>
<nav id="tabs">
  <span class="brand">{{TITLE}}</span>
  <button data-tab="universe"></button>
  <button data-tab="detail"></button>
  <button data-tab="schema"></button>
  <span class="grow"></span>
  <details id="l-menu" class="menu"><summary><span id="l-menu-t"></span> <span aria-hidden="true">▾</span></summary>
    <div class="menu-pop">
      <button id="l-reset" type="button"></button>
      <span class="hint" id="l-reset-why" hidden></span>
      <button id="l-export" type="button"></button>
      <button id="l-import" type="button"></button>
    </div>
  </details>
  <input type="file" id="l-file" accept=".json,application/json" hidden>
  <span class="sr-only" id="export-live" role="status" aria-live="polite"></span>
</nav>

<section class="tab" id="tab-universe">
  <section id="f-view" role="region" aria-labelledby="f-title" hidden>
    <div class="toolbar" id="f-bar">
      <button id="f-back" type="button"><span aria-hidden="true">← </span><span id="f-back-t"></span></button>
      <h2 class="f-title" id="f-title"><span id="f-of"></span> <button id="f-start" type="button"><i id="f-dot"></i><b id="f-name"></b></button></h2>
      <label><span id="f-h-dir"></span> <select id="f-dir"></select></label>
      <label><span id="f-h-depth"></span> <select id="f-depth"></select></label>
      <span id="f-counts"></span>
      <details id="f-domains"><summary id="f-dom-sum"></summary><ul class="tj-pop" id="f-dom-list"></ul></details>
      <span id="f-cap" hidden></span>
      <span class="grow"></span>
      <button id="f-fit" type="button"></button>
      <span class="export" role="group" aria-labelledby="f-export-h"><span id="f-export-h"></span>
        <button id="f-export-png" type="button" disabled></button><button id="f-export-svg" type="button" disabled></button></span>
    </div>
    <span class="sr-only" id="f-live" role="status" aria-live="polite"></span>
    <div class="canvas-box"><div id="f-graph"></div><div class="tip" id="f-tip"></div></div>
  </section>
  <aside class="panel" id="u-panel">
    <section id="u-nav" aria-labelledby="u-h-nav">
      <h2 id="u-h-nav"></h2>
      <div class="meta" id="u-meta"></div>
      <fieldset id="u-by" hidden><legend id="u-h-by"></legend>
        <label><input type="radio" name="u-by" value="domains"><span id="u-by-domains"></span><small id="u-by-domains-n"></small></label>
        <label><input type="radio" name="u-by" value="layers"><span id="u-by-layers"></span><small id="u-by-layers-n"></small></label>
      </fieldset>
      <h3><span id="u-h-domains"></span><span><a id="u-all"></a> · <a id="u-none"></a></span></h3>
      <div id="u-domains"></div>
      <h3 id="u-systems-h"><span id="u-h-systems"></span><span><a id="u-sys-all"></a> · <a id="u-sys-none"></a></span></h3>
      <div id="u-systems"></div>
    </section>
    <section id="u-display" aria-labelledby="u-h-display">
      <h2 id="u-h-display"></h2>
      <h3 id="u-h-detail"></h3>
      <select id="u-detail" aria-labelledby="u-h-detail"></select>
      <details id="u-more"><summary id="u-more-t"></summary>
        <fieldset id="u-fold" hidden><legend class="sr-only" id="u-h-fold"></legend>
          <label id="u-fold-row"><input type="checkbox" id="u-fold-box"><span id="u-fold-label"></span><small id="u-fold-n"></small></label>
        </fieldset>
        <h3 id="u-h-links"></h3>
        <select id="u-links" aria-labelledby="u-h-links"></select>
        <div id="u-routes-on-row" hidden>
          <label id="u-routes-on-line"><input type="checkbox" id="u-routes-on-box"><span id="u-routes-on-label"></span></label>
          <label id="u-routes-all"><input type="checkbox" id="u-routes-box" aria-describedby="u-routes-why"><span id="u-routes-label"></span><span class="sr-only" id="u-routes-why"></span></label>
        </div>
        <label id="u-cards-row"><input type="checkbox" id="u-cards-box"><span id="u-cards-label"></span></label>
      </details>
    </section>
    <section id="u-filters" aria-labelledby="u-h-filters">
      <h2 id="u-h-filters"></h2>
      <h3><span id="u-h-layers"></span></h3>
      <div id="u-layers"></div>
      <h3><span id="u-h-kinds"></span></h3>
      <div id="u-kinds"></div>
    </section>
  </aside>
  <div class="stage">
    <div class="toolbar">
      <button id="u-toggle" type="button" aria-controls="u-panel" aria-expanded="true">☰</button>
      <nav id="u-crumbs" class="crumbs" aria-label="Location"></nav>
      <input id="u-q" list="u-names" autocomplete="off"><datalist id="u-names"></datalist>
      <button id="u-traj" type="button" disabled></button>
      <details class="help"><summary id="u-help-t"></summary><div class="help-pop" id="u-hint"></div></details>
      <button id="u-fit"></button>
      <span class="export" role="group" aria-labelledby="u-export-h"><span id="u-export-h"></span>
        <button id="u-export" type="button"></button></span>
    </div>
    <div class="canvas-box" id="u-stage">
      <div class="trajbar" id="u-trajbar" role="region" hidden>
        <span class="tj-start"><span id="u-tj-title"></span> <i id="u-tj-dot"></i><b id="u-tj-start"></b></span>
        <label><span id="u-tj-h-dir"></span> <select id="u-tj-dir"></select></label>
        <label><span id="u-tj-h-depth"></span> <select id="u-tj-depth"></select></label>
        <details id="u-tj-counts"><summary id="u-tj-sum"></summary><ul class="tj-pop" id="u-tj-list"></ul></details>
        <span id="u-tj-empty" hidden></span>
        <span class="tj-hidden" id="u-tj-hidden"></span>
        <span class="tj-back" id="u-tj-back"></span>
        <span class="tj-legend"><span><i class="mk start"></i><span id="u-tj-l-start"></span></span>
          <span><i class="mk up"></i><span id="u-tj-l-up"></span></span>
          <span><i class="mk down"></i><span id="u-tj-l-down"></span></span></span>
        <span class="grow"></span>
        <button id="u-tj-flow" type="button"></button>
        <button id="u-tj-leave" type="button"></button>
      </div>
      <span class="sr-only" id="u-tj-live" role="status" aria-live="polite"></span>
      <span class="sr-only" id="u-live" role="status" aria-live="polite"></span>
      <canvas id="u-canvas"></canvas>
      <section class="tpanel" id="u-tpanel" role="region" aria-labelledby="u-tp-name" hidden></section>
      <div class="inside-note" id="u-inside-note" hidden></div>
      <section class="sr-only" id="u-summary" aria-labelledby="u-summary-h"><h2 id="u-summary-h"></h2></section>
      <div class="tip" id="u-tip"></div>
    </div>
  </div>
</section>

<section class="tab" id="tab-detail">
  <aside class="panel" id="d-panel">
    <h3 id="d-h-group"></h3>
    <select id="d-group" aria-labelledby="d-h-group"></select>
    <fieldset id="d-fold" hidden><legend id="d-h-fold"></legend>
      <label id="d-fold-row"><input type="checkbox" id="d-fold-box"><span id="d-fold-label"></span><small id="d-fold-n"></small></label>
      <p class="hint" id="d-fold-warn" role="status"></p>
      <button id="d-fold-now" type="button" hidden></button>
    </fieldset>
    <h3 id="d-h-depth"></h3>
    <select id="d-depth" aria-labelledby="d-h-depth" aria-describedby="d-depth-note"></select>
    <div class="hint" id="d-depth-note" hidden></div>
    <h3 id="d-h-cols"></h3>
    <select id="d-cols" aria-labelledby="d-h-cols"></select>
    <h3 id="d-h-kinds"></h3>
    <div id="d-types"></div>
  </aside>
  <div class="stage">
    <div class="toolbar">
      <button id="d-toggle" type="button" aria-controls="d-panel" aria-expanded="true">☰</button>
      <nav id="d-crumbs" class="crumbs" hidden></nav>
      <span class="meta" id="d-meta"></span>
      <span class="focus-info" id="d-focus-info"></span>
      <span class="grow"></span>
      <input id="d-focus" list="d-tables" autocomplete="off"><datalist id="d-tables"></datalist>
      <button id="d-clear"></button>
      <input id="d-q">
      <details class="help"><summary id="d-help-t"></summary><div class="help-pop" id="d-hint"></div></details>
      <button id="d-fit"></button>
      <span class="export" role="group" aria-labelledby="d-export-h"><span id="d-export-h"></span>
        <button id="d-export-png" type="button" disabled></button><button id="d-export-svg" type="button" disabled></button></span>
    </div>
    <span class="sr-only" id="d-live" role="status" aria-live="polite"></span>
    <div class="canvas-box"><div id="d-graph"></div></div>
  </div>
</section>

<section class="tab" id="tab-schema">
  <aside class="panel" id="s-panel">
    <section aria-labelledby="s-h-scope">
      <h2 id="s-h-scope"></h2>
      <select id="s-scope"></select>
      <div class="hint" id="s-scope-why"></div>
    </section>
    <section aria-labelledby="s-h-show">
      <h2 id="s-h-show"></h2>
      <select id="s-level"></select>
      <div class="hint" id="s-meta"></div>
      <div class="hint" id="s-note" hidden></div>
    </section>
  </aside>
  <div class="stage">
    <div class="toolbar">
      <button id="s-toggle" type="button" aria-controls="s-panel" aria-expanded="true">☰</button>
      <nav id="s-crumbs" class="crumbs" aria-label="Location"></nav>
      <input id="s-q" list="s-tables" autocomplete="off"><datalist id="s-tables"></datalist>
      <details class="help" id="s-help"><summary id="s-help-t"></summary><div class="help-pop" id="s-hint"></div></details>
      <button id="s-fit" type="button"></button>
      <span class="export" role="group" aria-labelledby="s-export-h"><span id="s-export-h"></span>
        <button id="s-export-png" type="button" disabled></button><button id="s-export-svg" type="button" disabled></button></span>
    </div>
    <div class="canvas-box" id="s-stage">
      <div id="s-graph" role="group" tabindex="0"></div>
      <div id="s-heads"></div>
      <div id="s-chips"></div>
      <canvas id="s-mini" aria-hidden="true" hidden></canvas>
      <div class="tip" id="s-tip"></div>
      <div id="s-pop" role="region" aria-label="" hidden></div>
      <div id="s-miss" aria-hidden="true" hidden></div>
      <div id="s-empty" role="status" hidden></div>
      <button id="s-back-all" type="button" hidden></button>
      <section class="sr-only" id="s-summary"></section>
      <span class="sr-only" id="s-live" role="status" aria-live="polite"></span>
    </div>
  </div>
</section>

<script type="application/json" id="data">{{DATA}}</script>
{{SCRIPTS}}
<script>
{{COMMON_JS}}
</script>
<script>
{{DETAIL_JS}}
</script>
<script>
{{UNIVERSE_JS}}
</script>
<script>
{{SCHEMA_JS}}
</script>
<script>
{{FLOW_JS}}
</script>
<script>
{{BOOT_JS}}
</script>
</body></html>
