<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{STYLE}}
</style></head><body>
<nav id="tabs">
  <span class="brand">{{TITLE}}</span>
  <button data-tab="universe"></button>
  <button data-tab="detail"></button>
  <span class="grow"></span>
  <span class="layout-actions">
    <button id="l-reset"></button>
    <button id="l-export"></button>
    <button id="l-import"></button>
    <input type="file" id="l-file" accept=".json,application/json" hidden>
  </span>
  <span class="sr-only" id="export-live" role="status" aria-live="polite"></span>
</nav>

<section class="tab" id="tab-universe">
  <section id="f-view" role="region" aria-labelledby="f-title" hidden>
    <div class="toolbar" id="f-bar">
      <button id="f-back" type="button"><span aria-hidden="true">← </span><span id="f-back-t"></span></button>
      <h2 class="f-title" id="f-title"><span id="f-of"></span> <button id="f-start" type="button"><i id="f-dot"></i><b id="f-name"></b></button></h2>
      <label><span id="f-h-dir"></span> <select id="f-dir"></select></label>
      <label><span id="f-h-depth"></span> <select id="f-depth"></select></label>
      <span id="f-counts"></span>
      <details id="f-domains"><summary id="f-dom-sum"></summary><ul class="tj-pop" id="f-dom-list"></ul></details>
      <span id="f-cap" hidden></span>
      <span class="grow"></span>
      <button id="f-fit" type="button"></button>
      <span class="export" role="group" aria-labelledby="f-export-h"><span id="f-export-h"></span>
        <button id="f-export-png" type="button" disabled></button><button id="f-export-svg" type="button" disabled></button></span>
    </div>
    <span class="sr-only" id="f-live" role="status" aria-live="polite"></span>
    <div class="canvas-box"><div id="f-graph"></div><div class="tip" id="f-tip"></div></div>
  </section>
  <aside class="panel" id="u-panel">
    <fieldset id="u-by" hidden><legend id="u-h-by"></legend>
      <label><input type="radio" name="u-by" value="domains"><span id="u-by-domains"></span><small id="u-by-domains-n"></small></label>
      <label><input type="radio" name="u-by" value="layers"><span id="u-by-layers"></span><small id="u-by-layers-n"></small></label>
    </fieldset>
    <fieldset id="u-fold" hidden><label class="fold"><input type="checkbox" id="u-fold-on" aria-describedby="u-fold-kinds"><span><span id="u-fold-t"></span><span class="sub" id="u-fold-kinds"></span></span><small id="u-fold-n"></small></label></fieldset>
    <h3 id="u-h-links"></h3>
    <select id="u-links" aria-labelledby="u-h-links"></select>
    <label id="u-routes-row" class="check" hidden><input type="checkbox" id="u-routes"> <span id="u-routes-t"></span></label>
    <h3 id="u-h-detail"></h3>
    <select id="u-detail" aria-labelledby="u-h-detail"></select>
    <h3><span id="u-h-layers"></span></h3>
    <div id="u-layers"></div>
    <h3><span id="u-h-kinds"></span></h3>
    <div id="u-kinds"></div>
    <h3><span id="u-h-domains"></span><span><a id="u-all"></a> · <a id="u-none"></a></span></h3>
    <div id="u-domains"></div>
    <h3 id="u-h-systems-row" hidden><span id="u-h-systems"></span><span><a id="u-sys-all"></a> · <a id="u-sys-none"></a></span></h3>
    <div id="u-systems"></div>
    <details id="u-sum"><summary id="u-sum-h"></summary><div id="u-sum-list"></div></details>
    <div class="hint" id="u-hint"></div>
  </aside>
  <div class="stage">
    <div class="toolbar">
      <button id="u-toggle" type="button" aria-controls="u-panel" aria-expanded="true">☰</button>
      <span class="meta" id="u-meta"></span>
      <span class="grow"></span>
      <input id="u-q" list="u-names" autocomplete="off"><datalist id="u-names"></datalist>
      <button id="u-traj" type="button" disabled></button>
      <button id="u-fit"></button>
      <span class="export" role="group" aria-labelledby="u-export-h"><span id="u-export-h"></span>
        <button id="u-export" type="button"></button></span>
    </div>
    <div class="canvas-box" id="u-stage">
      <div class="trajbar" id="u-trajbar" role="region" hidden>
        <span class="tj-start"><span id="u-tj-title"></span> <i id="u-tj-dot"></i><b id="u-tj-start"></b></span>
        <label><span id="u-tj-h-dir"></span> <select id="u-tj-dir"></select></label>
        <label><span id="u-tj-h-depth"></span> <select id="u-tj-depth"></select></label>
        <details id="u-tj-counts"><summary id="u-tj-sum"></summary><ul class="tj-pop" id="u-tj-list"></ul></details>
        <span id="u-tj-empty" hidden></span>
        <span class="tj-hidden" id="u-tj-hidden"></span>
        <span class="tj-back" id="u-tj-back"></span>
        <span class="tj-legend"><span><i class="mk start"></i><span id="u-tj-l-start"></span></span>
          <span><i class="mk up"></i><span id="u-tj-l-up"></span></span>
          <span><i class="mk down"></i><span id="u-tj-l-down"></span></span></span>
        <span class="grow"></span>
        <button id="u-tj-flow" type="button"></button>
        <button id="u-tj-leave" type="button"></button>
      </div>
      <span class="sr-only" id="u-tj-live" role="status" aria-live="polite"></span>
      <canvas id="u-canvas"></canvas>
      <div class="tip" id="u-tip"></div>
    </div>
  </div>
</section>

<section class="tab" id="tab-detail">
  <aside class="panel" id="d-panel">
    <h3 id="d-h-group"></h3>
    <select id="d-group" aria-labelledby="d-h-group"></select>
    <fieldset id="d-fold" hidden><label class="fold"><input type="checkbox" id="d-fold-on" aria-describedby="d-fold-kinds"><span><span id="d-fold-t"></span><span class="sub" id="d-fold-kinds"></span></span><small id="d-fold-n"></small></label><div class="warn" id="d-fold-warn" role="status"></div></fieldset>
    <h3 id="d-h-depth"></h3>
    <select id="d-depth" aria-labelledby="d-h-depth"></select>
    <h3 id="d-h-cols"></h3>
    <button id="d-cols"></button>
    <h3 id="d-h-kinds"></h3>
    <div id="d-types"></div>
    <div class="hint" id="d-hint"></div>
  </aside>
  <div class="stage">
    <div class="toolbar">
      <button id="d-toggle" type="button" aria-controls="d-panel" aria-expanded="true">☰</button>
      <span class="meta" id="d-meta"></span>
      <span class="focus-info" id="d-focus-info"></span>
      <span class="sr-only" id="d-live" role="status" aria-live="polite"></span>
      <span class="grow"></span>
      <input id="d-focus" list="d-tables" autocomplete="off"><datalist id="d-tables"></datalist>
      <button id="d-clear"></button>
      <input id="d-q">
      <button id="d-fit"></button>
      <span class="export" role="group" aria-labelledby="d-export-h"><span id="d-export-h"></span>
        <button id="d-export-png" type="button" disabled></button><button id="d-export-svg" type="button" disabled></button></span>
    </div>
    <div class="canvas-box"><div id="d-graph"></div></div>
  </div>
</section>

<script type="application/json" id="data">{{DATA}}</script>
{{SCRIPTS}}
<script>
{{COMMON_JS}}
</script>
<script>
{{DETAIL_JS}}
</script>
<script>
{{UNIVERSE_JS}}
</script>
<script>
{{FLOW_JS}}
</script>
<script>
{{BOOT_JS}}
</script>
</body></html>
