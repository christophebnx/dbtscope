default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: duplicate-code
        name: pylint duplicate-code
        entry: uv run pylint --disable=all --enable=duplicate-code src
        language: system
        pass_filenames: false
        types: [python]
      - id: commit-message
        name: commit message format
        entry: uv run python tools/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: local-ci
        name: CI checks, run locally before every push (D-053)
        entry: uv run python tools/ci.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
