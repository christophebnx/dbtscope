name: ci

# D-053: manual only (Actions minutes are not free). The checks run locally before every push
# (pre-push hook, `uv run python tools/ci.py`); run this workflow from the Actions tab when wanted.
# It runs exactly tools/ci.py (ruff check, pytest). Any other trigger, job or step needs an explicit
# request from the user; tests/unit/test_ci.py enforces it.

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/ci.py
