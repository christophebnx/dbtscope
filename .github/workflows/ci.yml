name: ci

# D-043: the default tests on Linux, Windows and macOS; ruff and the secret scan on Linux only.
# Installs only the `test` dependency group. Pull requests and pushes to main; also by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # gitleaks lists the commits of a pull request

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, py: python3}
          - {os: windows-latest, py: python}
          - {os: macos-latest, py: python3}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"  # the floor of requires-python
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}  # gitleaks needs the history (a 0 would read as false)
      # uv from PyPI: much faster on hosted runners than setup-uv's download from GitHub releases
      - run: ${{ matrix.py }} -m pip install -q --break-system-packages uv
      - run: ${{ matrix.py }} -m uv sync -q --locked --no-default-groups --group test
      - if: runner.os == 'Linux'
        run: ${{ matrix.py }} -m uv tool run ruff@0.17.3 check . && ${{ matrix.py }} -m uv tool run ruff@0.17.3 format --check .
      - run: ${{ matrix.py }} -m uv run --no-sync pytest -q -n auto -p no:cacheprovider
      - if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
