name: ci

# D-020, D-031: one Ubuntu job on pull requests and on main; ruff, the default tests, a secret scan.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # gitleaks lists the commits of a pull request

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the history of the pushed commits
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"  # the floor of requires-python
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q -n auto -m "not live and not browser"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
