name: ci

# D-043, D-044: the whole default suite and ruff on Linux; on Windows and macOS only the tests
# that touch the operating system (files, paths, CLI, subprocesses, page bytes).
# Installs only the `test` dependency group. Pull requests and pushes to main; also by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, py: python3, workers: auto, tests: ""}
          - {os: windows-latest, py: python, workers: "0", tests: "tests/unit/test_cli.py tests/unit/test_files.py tests/unit/test_project_files.py tests/unit/test_reference_pages.py tests/integration"}
          - {os: macos-latest, py: python3, workers: "0", tests: "tests/unit/test_cli.py tests/unit/test_files.py tests/unit/test_project_files.py tests/unit/test_reference_pages.py tests/integration"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      UV_PYTHON: "3.12"  # the floor of requires-python
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # uv from PyPI: much faster on hosted runners than setup-uv's download from GitHub releases
      - run: ${{ matrix.py }} -m pip install -q --break-system-packages uv
      - run: ${{ matrix.py }} -m uv sync -q --locked --no-default-groups --group test
      - if: runner.os == 'Linux'
        run: ${{ matrix.py }} -m uv tool run ruff@0.17.3 check . && ${{ matrix.py }} -m uv tool run ruff@0.17.3 format --check .
      - run: ${{ matrix.py }} -m uv run --no-sync pytest -q -n ${{ matrix.workers }} -p no:cacheprovider ${{ matrix.tests }}  # the short OS subset runs faster without worker start-up
