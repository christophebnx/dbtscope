name: ci

# D-020, D-032: paused during development, run by hand only (Actions > ci > Run workflow).
# To turn it back on, add the triggers of D-031 (pull_request, push to main) and record it.

on:
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the tests on Windows and macOS
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.all-os && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"  # the floor of requires-python
      - run: uv sync --locked
      - if: runner.os == 'Linux'
        run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q -n auto -m "not live and not browser"
      - if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
