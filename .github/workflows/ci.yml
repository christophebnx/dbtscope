name: ci

# D-043: the default tests on Linux, Windows and macOS; ruff and the secret scan on Linux only.
# Installs only the `test` dependency group. Pull requests and pushes to main; also by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # gitleaks lists the commits of a pull request

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.os == 'ubuntu-latest' && 0 || 1 }}  # gitleaks needs the history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"  # the floor of requires-python
      - run: uv sync --locked --no-default-groups --group test
      - if: runner.os == 'Linux'
        run: uvx ruff@0.17.3 check . && uvx ruff@0.17.3 format --check .
      - run: uv run --no-sync pytest -q -n auto -p no:cacheprovider
      - if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
