[project]
name = "dbtscope"
version = "0.2.0"
description = "Interactive map of a dbt project: domain universe and ERD, from the manifest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
dbtscope = "dbtscope.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8",
    "ruff>=0.6",
    "pylint>=3.2",
    "pre-commit>=3.8",
]
# D-019: browser tests only; not installed by `uv sync` (run with `uv run --group browser`).
browser = [
    "playwright==1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtscope"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
# D-028: every Python file starts with it (rule I002)
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real paid or remote service (costs money, needs network); never run by default",
    "browser: drives the page in headless Chromium (needs a local browser); never run by default",
]
addopts = "-m 'not live and not browser'"

[tool.coverage.run]
source = ["dbtscope"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
