# dbtscope configuration (https://github.com/christophebnx/dbtscope)
preset: data_vault
title: ACME retail
language: en
view: universe
# detail view: the raw vault (silver) and the star schema marts (gold); the kinds and their
# roles come from the data_vault preset
select: ["*_hub", "*_link", "*_sat", "dim_*", "fct_*"]
# universe view: silver and gold tables take their domain from their schema (one per domain folder,
# dbt_project.yml). These rules do two jobs: they place what is organised by source system, not by
# domain (sources, bronze models, seeds, snapshots), and they label and colour every domain.
domains:
  - {key: sales, label: Sales, color: "#d9822b", match: ["type:source,schema:raw_erp,orders", "type:source,schema:raw_erp,order_lines", "type:source,schema:raw_erp,stores", "stg_erp__orders", "stg_erp__order_lines", "stg_erp__stores"]}
  - {key: customer, label: Customer, color: "#4da3ff", match: ["type:source,schema:raw_erp,customers", "stg_erp__customers", "customers_snapshot", "country_codes"]}
  - {key: product, label: Product, color: "#2e8b57", match: ["type:source,schema:raw_erp,products", "type:source,schema:raw_erp,suppliers", "stg_erp__products", "stg_erp__suppliers", "products_snapshot"]}
  - {key: marketing, label: Marketing, color: "#c2549d", match: ["type:source,schema:raw_crm", "type:source,schema:raw_web", "stg_crm__*", "stg_web__*"]}
  - {key: finance, label: Finance, color: "#c9a227", match: ["type:source,schema:raw_billing", "stg_billing__*", "currency_rates"]}
  - {key: logistics, label: Logistics, color: "#5b7fa6", match: ["type:source,schema:raw_wms", "stg_wms__*"]}
  - {key: shared, label: Shared, color: "#777777", match: ["calendar"]}
# layers along the medallion; seeds and snapshots sit in Bronze (loaded or captured as is)
layers:
  - {key: source, label: Sources, match: ["type:source"]}
  - {key: bronze, label: Bronze, match: ["path:models/bronze_*", "type:seed", "type:snapshot"]}
  - {key: silver, label: Silver, match: ["path:models/silver/*"]}
  - {key: gold, label: Gold, match: ["path:models/gold/*"]}
